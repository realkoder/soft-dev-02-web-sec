user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	        worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##
	sendfile on;
	tcp_nopush on;
        tcp_nodelay on;
	types_hash_max_size 2048;
	server_tokens off;

       # server_names_hash_bucket_size 64;
       # server_name_in_redirect off;
       include /etc/nginx/mime.types;
       default_type application/octet-stream;


       # Better rate limiting zones
       limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
       limit_req_zone $binary_remote_addr zone=general_zone:10m rate=50r/s;
       limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

       # Connection limits per IP
       limit_conn_zone $binary_remote_addr zone=addr:10m;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 256;


	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

    server {
        listen 80;
        server_name www.munchora.pro;
        return 301 https://munchora.pro$request_uri;
    }

    server {
        listen 443 ssl http2; # managed by Certbot
        server_name munchora.pro www.munchora.pro;

        limit_conn addr 50;  # Max 50 connections per IP

        ssl_certificate /etc/letsencrypt/live/munchora.pro/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/munchora.pro/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

	location /uploads/ {
	    alias /var/www/munchora/uploads/;
            access_log off;
            expires 30d;
        }

	location /cable/notify {
               limit_req zone=general_zone burst=20 nodelay;

		proxy_pass http://localhost:9090/cable/notify; # Port your Rails app runs on
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}

        location /api {
            limit_req zone=api_zone burst=20 nodelay;


            proxy_pass http://localhost:9090;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    client_max_body_size 5M;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        location / {
            limit_req zone=general_zone burst=50 nodelay;


            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


}


